name: Todays Coffee

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC daily — adjust to your preferred time
  workflow_dispatch: {}      # allows manual runs from the Actions tab for testing

permissions:
  contents: write             # needed so the workflow can commit/push the image

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure ffmpeg is present
        run: ffmpeg -version || sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install huggingface_hub requests Pillow pynacl

      - name: Run daily coffee
        run: python coffee.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          #PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          #PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_REFRESH_TOKEN: ${{ secrets.TUMBLR_REFRESH_TOKEN }}
          TUMBLR_BLOG_NAME: ${{ secrets.TUMBLR_BLOG_NAME }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # keep this at "unlisted" until your Google Cloud project has
          # passed the audit; flip to "public" only after that clears
          YT_PRIVACY_STATUS: ${{ vars.YT_PRIVACY_STATUS }}
          GH_PAT: ${{ secrets.GH_PAT }}
